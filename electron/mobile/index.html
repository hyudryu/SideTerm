<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#202020">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SideTerm">
    <title>SideTerm Mobile</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="stylesheet" href="./xterm.css">
    <link rel="stylesheet" href="./mobile.css">
    <script defer src="./xterm.js"></script>
    <script defer src="./mobile.js"></script>
  </head>
  <body>
    <div id="mobile-app">
      <aside id="drawer" aria-label="Terminal sessions">
        <header><img src="./icon.png" alt=""><div><strong>SideTerm</strong><span>Mobile sessions</span></div><button id="drawer-close" aria-label="Close sessions">×</button></header>
        <nav id="mobile-sessions"></nav>
        <footer><button id="mobile-settings-button" type="button">⚙ Settings</button><span id="connection-detail">Connecting…</span><button id="install-button" hidden>Install app</button></footer>
      </aside>
      <button id="drawer-shade" aria-label="Close sessions" hidden></button>
      <div id="mobile-settings-backdrop" hidden>
        <form id="mobile-settings-sheet">
          <header><div><strong>Settings</strong><span>Mobile voice preferences</span></div><button id="mobile-settings-close" type="button" aria-label="Close settings">×</button></header>
          <label><span>Wake word</span><input id="mobile-wake-word" type="text" maxlength="80" placeholder="Hey Agent"></label>
          <label><span>Pocket TTS voice</span><select id="mobile-tts-voice"><option>alba</option><option>marius</option><option>javert</option><option>jean</option><option>fantine</option><option>cosette</option><option>eponine</option><option>azelma</option></select></label>
          <label><span>Voice speed <output id="mobile-tts-speed-value">1.00×</output></span><input id="mobile-tts-speed" type="range" min="0.75" max="1.5" step="0.05" value="1"></label>
          <p>LLM provider credentials and local model installation remain available only in desktop Settings.</p>
          <footer><span id="mobile-settings-status"></span><button type="submit">Save</button></footer>
        </form>
      </div>
      <main>
        <header class="mobile-topbar">
          <button id="menu-button" aria-label="Open sessions"><span></span><span></span><span></span></button>
          <div><strong id="mobile-title">SideTerm</strong><span id="mobile-subtitle">Connecting…</span></div>
          <div class="mobile-topbar-actions"><i id="connection-dot" title="Connection status"></i><button id="mode-toggle" type="button" aria-label="Switch view">Agent</button></div>
        </header>
        <section id="agent-dashboard" hidden>
          <div class="agent-mobile-status"><span id="agent-mobile-dot"></span><div><strong id="agent-mobile-status">Supervisor</strong><small id="agent-mobile-detail">Connecting…</small></div><button id="mobile-voice-toggle" type="button">Voice off</button></div>
          <section class="agent-mobile-notifications"><header><strong>Notifications</strong><span id="mobile-notification-count">0</span></header><div id="mobile-notifications"></div></section>
          <div id="mobile-agent-chat" class="agent-mobile-chat"></div>
          <div id="mobile-waveform" class="mobile-waveform" hidden><div class="wave-ring"><i></i><i></i><i></i><i></i><i></i></div><strong>Listening</strong><span id="mobile-wave-detail">Say the wake word, then ask</span></div>
          <div id="mobile-confirmations"></div>
          <form id="mobile-agent-form"><textarea id="mobile-agent-input" rows="2" enterkeyhint="send" placeholder="Ask your supervisor…"></textarea><button type="submit">Send</button></form>
        </section>
        <section id="terminal-view">
          <section id="mobile-terminal" aria-label="Terminal"></section>
          <form id="mobile-input-bar">
            <textarea id="mobile-input" rows="1" enterkeyhint="send" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type a command or prompt…" aria-label="Command or prompt"></textarea>
            <button type="submit">Send</button>
          </form>
          <div id="quick-keys" aria-label="Terminal keys">
            <button data-key="escape">Esc</button><button data-key="tab">Tab</button><button data-key="interrupt">Ctrl C</button><button data-key="clear-line">Ctrl U</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="enter" class="enter-key">Enter</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
